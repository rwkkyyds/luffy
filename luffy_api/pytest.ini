# ============================================================
# pytest 配置文件
# ============================================================
# 这个文件告诉 pytest 怎么找到和运行测试。
# 在 luffy_api/ 目录下执行 `pytest` 就会自动读取这个配置。
#
# 文件结构说明：
#   pytest.ini          ← 你在看的这个文件，全局配置
#   conftest.py         ← 共享的测试"工具人"（fixtures），所有测试文件都能用
#   setting/test.py     ← 测试专用的 Django 配置（用 SQLite 内存库，不依赖 MySQL）
#   tests/              ← 测试代码目录
#     test_utils.py     ← 测试工具模块（响应格式、异常、认证）
#     test_user.py      ← 测试用户模块（登录、注册、登出）
#     test_home.py      ← 测试首页模块（轮播图缓存）
#     test_course.py    ← 测试课程模块（列表、搜索、分页）
#     test_order.py     ← 测试订单模块（下单、支付回调）
#     test_ai.py        ← 测试 AI 模块（问答接口认证、限流）
#
# 运行方式：
#   cd luffy_api
#   pytest                      # 运行全部测试 + 覆盖率
#   pytest tests/test_user.py   # 只跑用户模块的测试
#   pytest -x                   # 遇到第一个失败就停止
#   pytest -k "login"           # 只跑名字里包含 login 的测试
# ============================================================

[pytest]
# 告诉 pytest 用哪个 Django 配置（测试专用，不是 dev.py）
DJANGO_SETTINGS_MODULE = luffy_api.setting.test

# Python 搜索路径：当前目录和 luffy_api/ 子目录
# 这样 import 的时候能直接写 from user.models import User
pythonpath = . luffy_api

# 默认参数：
#   --tb=short       失败时只显示简短的错误信息
#   -v               显示每个测试的名字和结果
#   --cov=luffy_api  统计 luffy_api/ 目录的代码覆盖率
#   --cov-report=term-missing  在终端显示哪些行没被测试覆盖
addopts = --tb=short -v --cov=luffy_api --cov-report=term-missing

# pytest 去哪些目录找测试文件
testpaths = tests luffy_api/apps

# 命名规则：文件名 test_*.py，类名 Test*，函数名 test_*
python_files = test_*.py
python_classes = Test*
python_functions = test_*
