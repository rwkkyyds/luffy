[uwsgi]
# 使用 http 协议（Docker 内 nginx 通过 http 代理过来）
http = 0.0.0.0:8080
# 项目入口（wsgi.py 的模块路径）
module = luffy_api.wsgi:application
# 工作目录（代码挂载到 /soft）
chdir = /soft
# 工作进程数（CPU 核心数 * 2 + 1，4核就9个）
processes = 4
# 每进程线程数
threads = 2
# 主进程（管理子进程，支持 graceful reload）
master = true
# 日志文件
logto = /soft/logs/uwsgi.log
# 进程 PID 文件（方便 stop/reload）
pidfile = /tmp/uwsgi.pid
# 优雅退出时间（超时强杀）
harakiri = 120
# 请求缓冲区（大文件上传）
buffer-size = 65535
# 不设置 lazy-apps，减少内存（共享主进程的代码段）
# lazy-apps = true
vacuum = true
