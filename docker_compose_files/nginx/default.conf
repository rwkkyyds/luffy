# 前端（Vue SPA）
server {
    listen 80;
    server_name _;
    charset utf-8;

    # 前端静态文件
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # Admin 静态资源
    location /static/ {
        alias /var/www/static/;
    }
    # 后端媒体文件（用户上传的图片等）
    location /media/ {
        proxy_pass http://django:8080/media/;
        proxy_set_header Host $http_host;
    }

    # 后端 API 代理
    location /api/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://django:8080;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Django Admin
    location /admin/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://django:8080;
    }
}
